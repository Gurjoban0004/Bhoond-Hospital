<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In — Bhoond Aesthetic Clinic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="center">
        <div class="login-card" role="region" aria-label="Bhoond Aesthetic Clinic account forms">

            <!-- left panel -->
            <aside class="login-hero">
                <div class="logo-wrap">
                    <div class="login-logo">A</div>
                    <div class="logo-text-wrap">
                        <span class="logo-name">Bhoond</span>
                        <span class="logo-sub">Aesthetic Clinic</span>
                    </div>
                </div>

                <p class="hero-quote">"Beauty begins<br>with confidence."</p>

                <p class="lead">Sign in to manage your consultations, view procedure details, and connect with your surgeon.</p>

                <div class="hero-image">
                    <img
                        src="https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=600&h=400&fit=crop&auto=format&q=80"
                        alt="Aesthetic skincare consultation"
                        loading="lazy"
                    >
                </div>
            </aside>

            <!-- right panel -->
            <main class="forms" aria-live="polite">

                <!-- Tabs -->
                <div class="tabs" role="tablist" aria-label="Authentication tabs">
                    <button id="tabLogin" class="tab active" role="tab" aria-selected="true"
                        aria-controls="panelLogin" onclick="showPanel('login')">Sign In</button>
                    <button id="tabSignup" class="tab" role="tab" aria-selected="false"
                        aria-controls="panelSignup" onclick="showPanel('signup')">Sign Up</button>
                </div>

                <!-- login form -->
                <div id="panelLogin" role="tabpanel" aria-labelledby="tabLogin">
                    <form id="loginForm" onsubmit="return onLogin(event)" novalidate>

                        <div class="field">
                            <label for="loginEmail">Email</label>
                            <input id="loginEmail" type="email" inputmode="email" autocomplete="username"
                                placeholder="you@example.com" required aria-describedby="loginEmailError" />
                            <div id="loginEmailError" class="error" aria-live="polite"></div>
                        </div>

                        <div class="field">
                            <label for="loginPassword">Password</label>
                            <input id="loginPassword" type="password" autocomplete="current-password"
                                placeholder="Enter your password" required aria-describedby="loginPasswordError" />
                            <span class="pwd-icon" id="toggleLoginPwd" title="Show/Hide password"
                                onclick="togglePwd('loginPassword','toggleLoginPwd')" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <path d="M12 5c5 0 9 5 9 7s-4 7-9 7-9-5-9-7 4-7 9-7Z"
                                        stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                                    <circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.4"/>
                                </svg>
                            </span>
                            <div id="loginPasswordError" class="error" aria-live="polite"></div>
                        </div>

                        <div class="forgot-row">
                            <a href="#" class="inline-link" onclick="onResetPassword(event)">Forgot password?</a>
                        </div>

                        <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
                        <button type="button" class="login-btn secondary" onclick="showPanel('signup')">
                            Create Account
                        </button>

                        <div id="loginNotice" aria-live="polite"></div>
                    </form>
                </div>

                <!-- signup form -->
                <div id="panelSignup" role="tabpanel" aria-labelledby="tabSignup" hidden>
                    <form id="signupForm" onsubmit="return onSignup(event)" novalidate>

                        <div class="field">
                            <label for="fullName">Full name</label>
                            <input id="fullName" type="text" autocomplete="name"
                                placeholder="e.g. Priya Sharma" required aria-describedby="nameError" />
                            <div id="nameError" class="error" aria-live="polite"></div>
                        </div>

                        <div class="field">
                            <label for="signupEmail">Email</label>
                            <input id="signupEmail" type="email" autocomplete="email"
                                placeholder="you@example.com" required aria-describedby="signupEmailError" />
                            <div id="signupEmailError" class="error" aria-live="polite"></div>
                        </div>

                        <div class="field">
                            <label for="signupPassword">Password</label>
                            <input id="signupPassword" type="password" autocomplete="new-password"
                                placeholder="Create a password (8+ characters)" required aria-describedby="signupPasswordError" />
                            <span class="pwd-icon" id="toggleSignupPwd" title="Show/Hide password"
                                onclick="togglePwd('signupPassword','toggleSignupPwd')" aria-label="Toggle password visibility">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <path d="M12 5c5 0 9 5 9 7s-4 7-9 7-9-5-9-7 4-7 9-7Z"
                                        stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                                    <circle cx="12" cy="12" r="2.4" stroke="currentColor" stroke-width="1.4"/>
                                </svg>
                            </span>
                            <div class="strength" aria-hidden="true"><i id="strengthBar"></i></div>
                            <div id="signupPasswordError" class="error" aria-live="polite"></div>
                        </div>

                        <button type="submit" class="login-btn">Create Account</button>
                        <button type="button" class="login-btn secondary" onclick="showPanel('login')">
                            Back to Sign In
                        </button>

                        <div id="signupNotice" aria-live="polite"></div>
                    </form>
                </div>

            </main>
        </div>
    </div>

    <script>
        // switch between login and signup tabs
        const panels = {
            login:  { tab: 'tabLogin',  panel: 'panelLogin'  },
            signup: { tab: 'tabSignup', panel: 'panelSignup' },
        };

        function showPanel(name) {
            Object.keys(panels).forEach(k => {
                const t = document.getElementById(panels[k].tab);
                const p = document.getElementById(panels[k].panel);
                const active = k === name;
                t.classList.toggle('active', active);
                t.setAttribute('aria-selected', String(active));
                active ? p.removeAttribute('hidden') : (p.hidden = true);
            });
            setTimeout(() => {
                const first = document.querySelector('#' + panels[name].panel + ' input');
                if (first) first.focus();
            }, 80);
        }

        // helpers
        function togglePwd(inputId) {
            const inp = document.getElementById(inputId);
            if (!inp) return;
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }

        function setError(id, msg) {
            const el = document.getElementById(id);
            if (el) el.textContent = msg || '';
        }

        function setNotice(id, msg, type = 'success') {
            const el = document.getElementById(id);
            if (!el) return;
            el.innerHTML = msg
                ? `<div class="notice ${type}">${msg}</div>`
                : '';
        }

        function setBtnLoading(btn, loading, label) {
            btn.disabled = loading;
            btn.textContent = loading ? label : btn.dataset.original;
        }

        // password strength bar
        function scorePassword(pw) {
            if (!pw) return 0;
            let s = 0;
            if (pw.length >= 8) s++;
            if (/[A-Z]/.test(pw)) s++;
            if (/[0-9]/.test(pw)) s++;
            if (/[@$!%*?&]/.test(pw)) s++;
            return Math.min(s, 4);
        }

        const strengthBar = document.getElementById('strengthBar');
        const pwInput     = document.getElementById('signupPassword');
        if (pwInput) {
            pwInput.addEventListener('input', () => {
                const s = scorePassword(pwInput.value);
                if (strengthBar) {
                    strengthBar.style.width = (s * 25) + '%';
                    strengthBar.style.background =
                        s <= 1 ? '#ff6b6b' : s === 2 ? '#f6c343' : s === 3 ? '#7ed957' : '#05a284';
                }
            });
        }

        // handle login
        async function onLogin(e) {
            e.preventDefault();
            const email    = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            setError('loginEmailError', '');
            setError('loginPasswordError', '');
            setNotice('loginNotice', '');

            if (!email)    { setError('loginEmailError', 'Enter your email.'); return false; }
            if (!password) { setError('loginPasswordError', 'Enter your password.'); return false; }

            const btn = document.getElementById('loginBtn');
            btn.dataset.original = btn.textContent;
            setBtnLoading(btn, true, 'Signing in…');

            try {
                const res  = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('aura_user', JSON.stringify(data.user));
                    setNotice('loginNotice', `Welcome back, ${data.user.name}! Redirecting…`, 'success');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 900);
                } else {
                    setNotice('loginNotice', data.error || 'Login failed. Please try again.', 'error');
                }
            } catch (err) {
                setNotice('loginNotice', 'Server is not running. Make sure the server is started on port 3000.', 'error');
            } finally {
                setBtnLoading(btn, false);
            }
            return false;
        }

        // handle signup
        async function onSignup(e) {
            e.preventDefault();
            const name     = document.getElementById('fullName').value.trim();
            const email    = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;

            setError('nameError', '');
            setError('signupEmailError', '');
            setError('signupPasswordError', '');
            setNotice('signupNotice', '');

            let ok = true;
            if (!name || name.length < 3)
                { setError('nameError', 'Full name must be at least 3 characters.'); ok = false; }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))
                { setError('signupEmailError', 'Enter a valid email.'); ok = false; }
            if (password.length < 8)
                { setError('signupPasswordError', 'Password must be at least 8 characters.'); ok = false; }
            if (!ok) return false;

            const btn = document.querySelector('#panelSignup button[type="submit"]');
            btn.dataset.original = btn.textContent;
            setBtnLoading(btn, true, 'Creating…');

            try {
                const res  = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password }),
                });
                const data = await res.json();

                if (res.ok) {
                    setNotice('signupNotice', 'Account created! Check your email for a welcome message.', 'success');
                    setTimeout(() => showPanel('login'), 2000);
                } else {
                    setNotice('signupNotice', data.error || 'Signup failed. Please try again.', 'error');
                }
            } catch (err) {
                setNotice('signupNotice', 'Server is not running. Make sure the server is started on port 3000.', 'error');
            } finally {
                setBtnLoading(btn, false);
            }
            return false;
        }

        function onResetPassword(e) {
            e && e.preventDefault();
            setNotice('loginNotice', 'Password reset is not yet available. Contact us at support@auraaesthetic.com', 'error');
        }

        document.addEventListener('DOMContentLoaded', () => {
            showPanel('login');
            document.getElementById('loginEmail').focus();
        });
    </script>
</body>
</html>
